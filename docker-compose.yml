services:
  trophaeenschrank:
    image: ghcr.io/shakanuga/trophaeenschrank:latest
    # Selbst bauen statt fertiges Image ziehen: nächste Zeile einkommentieren
    # build: .
    container_name: trophaeenschrank
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      - TZ=Europe/Berlin
      - PUID=99
      - PGID=100
    volumes:
      - /mnt/user/appdata/trophaeenschrank:/data
